<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover — иначе safe-area-inset-* всегда равны нулю -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e9e1d6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Дом Кино" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Иконка вшита прямо сюда: без неё браузер всё равно просит /favicon.ico,
         а сервер на такой запрос отдавал приложение целиком вторым заходом. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23241417'/%3E%3Cg fill='%23e9e1d6'%3E%3Crect x='8' y='9' width='4' height='14' rx='1.2'/%3E%3Crect x='14' y='6' width='4' height='17' rx='1.2'/%3E%3Crect x='20' y='11' width='4' height='12' rx='1.2'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>Дом Кино</title>

    <!--
      Заглушка на время загрузки скрипта. Стили лежат прямо здесь, а не в
      подключаемом файле: иначе она сама ждала бы своей загрузки и смысла
      в ней не было бы.

      Фон совпадает с заставкой (#0e0a0c), поэтому подмена заглушки на
      приложение не читается как вспышка.
    -->
    <style>
      /* Фон непрозрачный с первого кадра и гаснуть не должен: анимируется
         только надпись. Если растворять всю панель, то первые доли секунды
         светится белая страница — ровно та вспышка, от которой уходим. */
      #dk-boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0e0a0c;
        font-family: 'Oswald', system-ui, sans-serif;
        font-size: 13px;
        font-weight: 300;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        text-align: center;
        color: rgba(233, 225, 214, 0.55);
      }

      /* Обе строки в одной ячейке сетки: невидимое сообщение об ошибке
         не занимает места и не сдвигает «Загрузку» с центра экрана. */
      #dk-boot b,
      #dk-boot i {
        grid-area: 1 / 1;
        font: inherit;
        opacity: 0;
      }

      /* Надпись появляется с задержкой: на быстрой связи приложение успевает
         запуститься раньше, и мигать ею незачем. */
      #dk-boot b {
        animation:
          dk-boot-in 0.5s ease 0.4s forwards,
          dk-boot-pulse 1.8s ease-in-out 0.9s infinite,
          dk-boot-out 0.4s ease 20s forwards;
      }

      /* Если за двадцать секунд скрипт так и не доехал — связь оборвалась.
         Сообщение выводится средствами CSS: JS в этот момент как раз и нет.
         Разрядку и капитель здесь снимаем: целая фраза так не читается,
         а нужна она ровно тогда, когда человек не понимает, что происходит. */
      #dk-boot i {
        max-width: 17em;
        text-transform: none;
        letter-spacing: 0.01em;
        line-height: 1.6;
        animation: dk-boot-in 0.5s ease 20.4s forwards;
      }

      @keyframes dk-boot-in {
        to {
          opacity: 1;
        }
      }

      @keyframes dk-boot-out {
        to {
          opacity: 0;
        }
      }

      @keyframes dk-boot-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }
    </style>
  </head>
  <body>
    <!-- Содержимое #root React затирает при первом рендере — заглушку
         убирать вручную не нужно (проверено: элемента в DOM не остаётся). -->
    <div id="root">
      <div id="dk-boot">
        <b>Загрузка</b>
        <i>Не удалось загрузить. Проверьте связь и обновите страницу.</i>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
